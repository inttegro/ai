interface:
  display_name: "Inttegro buy links"
  short_description: "Manage links for existing sellable offers"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-sell-by-link to create or manage a buy link for this existing product and price."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro catalog, buy-link, and messaging tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
