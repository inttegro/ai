interface:
  display_name: "Inttegro offer setup"
  short_description: "Set up a product and price for a new offer"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-launch-offer to set up this offer and stop for my review before publishing or creating a buy link."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro catalog and buy-link tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
