name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
      - name: Validate portable package
        run: |
          node scripts/validate-public-package.mjs
          node scripts/sync-skills.mjs --check
          node scripts/validate-tool-coverage.mjs
          node scripts/validate-skill-routing.mjs
      - name: Test Inttegro AI CLI
        run: |
          npm run check
          npm test
          npm run pack:check
      - name: Test Visual Studio Code extension
        run: |
          npm --prefix extensions/vscode ci
          npm --prefix extensions/vscode run check
          npm --prefix extensions/vscode test
          npm --prefix extensions/vscode run package
      - name: Validate Claude marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.269 plugin validate . --strict
      - name: Validate Inttegro plugin
        run: npx -y @anthropic-ai/claude-code@2.1.269 plugin validate plugins/inttegro --strict
