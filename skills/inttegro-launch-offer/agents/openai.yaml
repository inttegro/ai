interface:
  display_name: "Inttegro offer launch"
  short_description: "Launch a product, price, and hosted buy link"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-launch-offer to turn this offer into a published product and verified buy link."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro catalog and buy-link tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
