interface:
  display_name: "Inttegro Customer Care"
  short_description: "Manage customers and consented messages safely"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-customer-care to review a customer and their recent message delivery status."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro customer and messaging tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
