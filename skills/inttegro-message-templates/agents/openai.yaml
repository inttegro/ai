interface:
  display_name: "Inttegro Message Templates"
  short_description: "Build and send reviewed Chime templates"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-message-templates to create, preview, and safely publish a reusable customer message."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro message-template and Chime tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
