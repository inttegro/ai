interface:
  display_name: "Inttegro Files"
  short_description: "Store and share merchant files safely"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-files to inspect a file and create a short-lived share link."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro file and file-link tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
