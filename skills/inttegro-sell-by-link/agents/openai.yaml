interface:
  display_name: "Inttegro Sell by Link"
  short_description: "Create products, prices, and hosted buy links"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-sell-by-link to create a buy link for a product and prepare it to send."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro catalog, buy-link, and messaging tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
