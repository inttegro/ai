interface:
  display_name: "Inttegro Daily Brief"
  short_description: "Summarize live merchant performance and trends"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-daily-brief to summarize my business performance for the last 30 days."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro tools and analytics"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
