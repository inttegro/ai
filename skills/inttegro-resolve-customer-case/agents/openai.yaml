interface:
  display_name: "Inttegro customer resolution"
  short_description: "Investigate and resolve one customer case"
  brand_color: "#16A249"
  default_prompt: "Use $inttegro-resolve-customer-case to investigate this customer issue and carry out the resolution I approve."
dependencies:
  tools:
    - type: "mcp"
      value: "inttegro"
      description: "Authenticated Inttegro customer, order, payment, message, and refund tools"
      transport: "streamable_http"
      url: "https://mcp.inttegro.com/"
policy:
  allow_implicit_invocation: true
